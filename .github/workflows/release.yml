# SPDX-License-Identifier: BSD-2-Clause
name: Release

# A v*.*.* tag on main: run CI again, build the .mltbx, and attach it (with
# build provenance) to a GitHub release made from the CHANGELOG section.
# MATLAB File Exchange has no upload API: the File Exchange entry is linked
# to this repository's GitHub releases once (see CONTRIBUTING.md), and it
# picks up each new release by itself.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the toolbox version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^ *Version = "\([^"]*\)".*/\1/p' toolbox/+ensembleweather/Client.m)"
          echo "toolbox version ${version}, tag ${TAG}"
          test "v${version}" = "${TAG}"
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2023b
      - uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3.4.0
        with:
          tasks: package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mltbx
          path: release/*.mltbx

  github-release:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/Ourea-Technologies/ensemble-weather-matlab/releases
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance (Sigstore, OIDC)
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mltbx
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mltbx
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md dist/*.mltbx
