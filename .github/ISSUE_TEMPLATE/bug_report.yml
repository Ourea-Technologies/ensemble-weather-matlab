name: Bug report
description: Something in the MATLAB toolbox does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Please do not file it here; see SECURITY.md.
        Never paste your API key.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: matlab
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Toolbox version (ensembleweather.Client.Version)
    validations:
      required: true
  - type: input
    id: matlab
    attributes:
      label: MATLAB release (version) and OS
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id (err.RequestId), if any
